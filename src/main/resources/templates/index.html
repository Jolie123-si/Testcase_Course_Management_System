<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Management</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        form { background: #f4f4f4; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        input { margin: 5px 0 10px 0; padding: 6px; width: 100%; box-sizing: border-box; }
        button { padding: 8px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result { padding: 10px; background: #e8f5e9; border-left: 4px solid #4caf50; margin-top: 10px; }
    </style>
</head>
<body>

<h2>Save Course</h2>
<form action="/save" method="post">
    <label>Code:</label>
    <input type="text" name="code" required/>
    <label>Name:</label>
    <input type="text" name="name" required/>
    <label>Credits (1-5):</label>
    <input type="number" name="credits" required/>
    <label>Max Students:</label>
    <input type="number" name="maxStudents" required/>
    <button type="submit">Save</button>
</form>

<h2>Search Course</h2>
<form action="/search" method="get">
    <label>Course Code:</label>
    <input type="text" name="code" required/>
    <button type="submit">Search</button>
</form>

<h2>Delete Course</h2>
<form action="/delete" method="get">
    <label>Course Code:</label>
    <input type="text" name="code" required/>
    <button type="submit">Delete</button>
</form>

<!-- Result message -->
<div class="result" th:if="${message}">
    <b>Result:</b> <span th:text="${message}"></span>
</div>

<!-- Search result -->
<div class="result" th:if="${searchResult}">
    <b>Found:</b>
    <span th:text="${searchResult.courseCode}"></span> -
    <span th:text="${searchResult.courseName}"></span> |
    Credits: <span th:text="${searchResult.credits}"></span> |
    Max Students: <span th:text="${searchResult.maxStudents}"></span>
</div>
<div class="result" th:if="${searchResult == null and param.code != null}">
    <b>Course not found</b>
</div>

</body>
</html>
